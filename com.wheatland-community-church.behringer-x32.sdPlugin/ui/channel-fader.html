<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mixer Fader Configuration</title>
    <link rel="stylesheet" href="../css/property-inspector.css">
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-heading">X32 Mixer Connection</div>
        
        <div class="sdpi-item">
            <div class="sdpi-item-label">X32 IP Address</div>
            <input class="sdpi-item-value" id="x32Host" type="text" placeholder="192.168.1.100" />
        </div>
        
        <div class="sdpi-heading">Fader Target</div>
        
        <div class="sdpi-item">
            <div class="sdpi-item-label">Target Type</div>
            <select class="sdpi-item-value" id="targetType">
                <option value="channel">Input Channel</option>
                <option value="main">Main L/R</option>
                <option value="bus">Bus Master</option>
                <option value="matrix">Matrix</option>
                <option value="dca">DCA</option>
            </select>
        </div>

        <div class="sdpi-item" id="targetNumberSetting">
            <div class="sdpi-item-label" id="targetNumberLabel">Input Channel</div>
            <select class="sdpi-item-value" id="targetNumber"></select>
        </div>
        
        <div class="sdpi-heading">Fader Settings</div>
        
        <div class="sdpi-item" id="stepSetting">
            <div class="sdpi-item-label">Step Size</div>
            <select class="sdpi-item-value" id="step">
                <option value="0.01">Fine (1%)</option>
                <option value="0.025">Small (2.5%)</option>
                <option value="0.05" selected>Medium (5%)</option>
                <option value="0.1">Large (10%)</option>
            </select>
        </div>
        
        <div class="sdpi-item" id="fineStepSetting">
            <div class="sdpi-item-label">Fine Step Size (Dial Pressed)</div>
            <select class="sdpi-item-value" id="fineStep">
                <option value="0.001">Ultra Fine (0.1%)</option>
                <option value="0.005">Very Fine (0.5%)</option>
                <option value="0.01" selected>Fine (1%)</option>
                <option value="0.025">Small (2.5%)</option>
            </select>
        </div>
        
        <div class="sdpi-item" id="dialPressActionSetting">
            <div class="sdpi-item-label">Dial Press Action</div>
            <select class="sdpi-item-value" id="dialPressAction">
                <option value="mute" selected>Mute/Unmute Target</option>
                <option value="unity">Set to Unity (0dB)</option>
                <option value="fine">Enable Fine Adjustment</option>
            </select>
        </div>
        
        <div class="sdpi-item">
            <div class="sdpi-item-label">Usage</div>
            <div class="sdpi-item-value" id="usageInfo" style="font-size: 12px; color: #999;">
                <!-- Usage instructions will be dynamically inserted based on controller type -->
            </div>
        </div>
        
        <div class="sdpi-item">
            <div class="sdpi-item-label">Test Connection</div>
            <button class="sdpi-item-value" id="testConnection" type="button">Test X32 Connection</button>
        </div>
        
        <div class="sdpi-item" id="connectionStatus" style="display: none;">
            <div class="sdpi-item-label">Status</div>
            <div class="sdpi-item-value" id="statusText"></div>
        </div>
    </div>

    <script src="../js/property-inspector.js"></script>
</body>
</html>
